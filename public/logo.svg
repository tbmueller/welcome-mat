<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" shape-rendering="crispEdges">
  <defs>
    <pattern id="cb" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#8B2040"/>
      <rect x="4" y="0" width="4" height="4" fill="#C45C7A"/>
      <rect x="0" y="4" width="4" height="4" fill="#C45C7A"/>
      <rect x="4" y="4" width="4" height="4" fill="#8B2040"/>
    </pattern>
  </defs>

  <!-- ── Wood floor ── -->
  <rect width="240" height="160" fill="#D4A860"/>
  <rect y="36"  width="240" height="32" fill="#C99040"/>
  <rect y="104" width="240" height="32" fill="#C99040"/>
  <rect y="32"  width="240" height="4"  fill="#9B6E28"/>
  <rect y="68"  width="240" height="4"  fill="#9B6E28"/>
  <rect y="104" width="240" height="4"  fill="#9B6E28"/>
  <rect y="140" width="240" height="4"  fill="#9B6E28"/>
  <!-- Grain lines -->
  <rect x="60"  y="0"   width="4" height="32" fill="#BE9238"/>
  <rect x="140" y="0"   width="4" height="32" fill="#BE9238"/>
  <rect x="32"  y="36"  width="4" height="32" fill="#BE9238"/>
  <rect x="100" y="36"  width="4" height="32" fill="#BE9238"/>
  <rect x="172" y="36"  width="4" height="32" fill="#BE9238"/>
  <rect x="60"  y="72"  width="4" height="32" fill="#BE9238"/>
  <rect x="148" y="72"  width="4" height="32" fill="#BE9238"/>
  <rect x="44"  y="108" width="4" height="32" fill="#BE9238"/>
  <rect x="120" y="108" width="4" height="32" fill="#BE9238"/>
  <rect x="196" y="108" width="4" height="32" fill="#BE9238"/>
  <rect x="80"  y="144" width="4" height="16" fill="#BE9238"/>
  <rect x="168" y="144" width="4" height="16" fill="#BE9238"/>

  <!-- ── Rug drop shadow ── -->
  <rect x="28" y="28" width="192" height="112" fill="#4A2508"/>

  <!-- ── Rug ── -->
  <g transform="translate(24,24)">

    <!-- Outer dark border -->
    <rect x="0"   y="0"   width="192" height="8"  fill="#2D0B1A"/>
    <rect x="0"   y="104" width="192" height="8"  fill="#2D0B1A"/>
    <rect x="0"   y="8"   width="8"   height="96" fill="#2D0B1A"/>
    <rect x="184" y="8"   width="8"   height="96" fill="#2D0B1A"/>

    <!-- Checkerboard inner border -->
    <rect x="8"   y="8"  width="176" height="8"  fill="url(#cb)"/>
    <rect x="8"   y="96" width="176" height="8"  fill="url(#cb)"/>
    <rect x="8"   y="16" width="8"   height="80" fill="url(#cb)"/>
    <rect x="176" y="16" width="8"   height="80" fill="url(#cb)"/>

    <!-- Solid maroon separator strip (inner frame) -->
    <rect x="16" y="16" width="160" height="4"  fill="#8B2040"/>
    <rect x="16" y="92" width="160" height="4"  fill="#8B2040"/>
    <rect x="16" y="20" width="4"   height="72" fill="#8B2040"/>
    <rect x="172" y="20" width="4"  height="72" fill="#8B2040"/>

    <!-- Interior deep pink field -->
    <rect x="20" y="20" width="152" height="72" fill="#C86090"/>

    <!-- Corner accent squares (2×2 pixel maroon) -->
    <rect x="20"  y="20" width="8" height="8" fill="#8B2040"/>
    <rect x="164" y="20" width="8" height="8" fill="#8B2040"/>
    <rect x="20"  y="84" width="8" height="8" fill="#8B2040"/>
    <rect x="164" y="84" width="8" height="8" fill="#8B2040"/>

    <!-- Rose ring (1px border around maroon diamond) -->
    <rect x="96" y="20" width="4"   height="4" fill="#C45C7A"/>
    <rect x="92" y="24" width="12"  height="4" fill="#C45C7A"/>
    <rect x="88" y="28" width="20"  height="4" fill="#C45C7A"/>
    <rect x="80" y="32" width="36"  height="4" fill="#C45C7A"/>
    <rect x="76" y="36" width="44"  height="4" fill="#C45C7A"/>
    <rect x="68" y="40" width="60"  height="4" fill="#C45C7A"/>
    <rect x="64" y="44" width="68"  height="4" fill="#C45C7A"/>
    <rect x="56" y="48" width="84"  height="4" fill="#C45C7A"/>
    <rect x="52" y="52" width="92"  height="4" fill="#C45C7A"/>
    <rect x="44" y="56" width="108" height="4" fill="#C45C7A"/>
    <rect x="52" y="60" width="92"  height="4" fill="#C45C7A"/>
    <rect x="56" y="64" width="84"  height="4" fill="#C45C7A"/>
    <rect x="64" y="68" width="68"  height="4" fill="#C45C7A"/>
    <rect x="68" y="72" width="60"  height="4" fill="#C45C7A"/>
    <rect x="76" y="76" width="44"  height="4" fill="#C45C7A"/>
    <rect x="80" y="80" width="36"  height="4" fill="#C45C7A"/>
    <rect x="88" y="84" width="20"  height="4" fill="#C45C7A"/>
    <rect x="92" y="88" width="12"  height="4" fill="#C45C7A"/>
    <rect x="96" y="92" width="4"   height="4" fill="#C45C7A"/>

    <!-- Outer maroon diamond (h=12, v=8, center SVG 96,56) -->
    <rect x="96" y="24" width="4"   height="4" fill="#8B2040"/>
    <rect x="92" y="28" width="12"  height="4" fill="#8B2040"/>
    <rect x="84" y="32" width="28"  height="4" fill="#8B2040"/>
    <rect x="80" y="36" width="36"  height="4" fill="#8B2040"/>
    <rect x="72" y="40" width="52"  height="4" fill="#8B2040"/>
    <rect x="68" y="44" width="60"  height="4" fill="#8B2040"/>
    <rect x="60" y="48" width="76"  height="4" fill="#8B2040"/>
    <rect x="56" y="52" width="84"  height="4" fill="#8B2040"/>
    <rect x="48" y="56" width="100" height="4" fill="#8B2040"/>
    <rect x="56" y="60" width="84"  height="4" fill="#8B2040"/>
    <rect x="60" y="64" width="76"  height="4" fill="#8B2040"/>
    <rect x="68" y="68" width="60"  height="4" fill="#8B2040"/>
    <rect x="72" y="72" width="52"  height="4" fill="#8B2040"/>
    <rect x="80" y="76" width="36"  height="4" fill="#8B2040"/>
    <rect x="84" y="80" width="28"  height="4" fill="#8B2040"/>
    <rect x="92" y="84" width="12"  height="4" fill="#8B2040"/>
    <rect x="96" y="88" width="4"   height="4" fill="#8B2040"/>

    <!-- Inner lighter pink (h=10, v=6 — creates diamond border effect) -->
    <rect x="96" y="32" width="4"  height="4" fill="#D878A8"/>
    <rect x="92" y="36" width="12" height="4" fill="#D878A8"/>
    <rect x="84" y="40" width="28" height="4" fill="#D878A8"/>
    <rect x="76" y="44" width="44" height="4" fill="#D878A8"/>
    <rect x="72" y="48" width="52" height="4" fill="#D878A8"/>
    <rect x="64" y="52" width="68" height="4" fill="#D878A8"/>
    <rect x="56" y="56" width="84" height="4" fill="#D878A8"/>
    <rect x="64" y="60" width="68" height="4" fill="#D878A8"/>
    <rect x="72" y="64" width="52" height="4" fill="#D878A8"/>
    <rect x="76" y="68" width="44" height="4" fill="#D878A8"/>
    <rect x="84" y="72" width="28" height="4" fill="#D878A8"/>
    <rect x="92" y="76" width="12" height="4" fill="#D878A8"/>
    <rect x="96" y="80" width="4"  height="4" fill="#D878A8"/>

    <!-- Quadrant accent diamonds (3px, in rose) -->
    <!-- Top-left -->
    <rect x="36" y="32" width="4"  height="4" fill="#C45C7A"/>
    <rect x="32" y="36" width="12" height="4" fill="#C45C7A"/>
    <rect x="36" y="40" width="4"  height="4" fill="#C45C7A"/>
    <!-- Top-right -->
    <rect x="152" y="32" width="4"  height="4" fill="#C45C7A"/>
    <rect x="148" y="36" width="12" height="4" fill="#C45C7A"/>
    <rect x="152" y="40" width="4"  height="4" fill="#C45C7A"/>
    <!-- Bottom-left -->
    <rect x="36" y="72" width="4"  height="4" fill="#C45C7A"/>
    <rect x="32" y="76" width="12" height="4" fill="#C45C7A"/>
    <rect x="36" y="80" width="4"  height="4" fill="#C45C7A"/>
    <!-- Bottom-right -->
    <rect x="152" y="72" width="4"  height="4" fill="#C45C7A"/>
    <rect x="148" y="76" width="12" height="4" fill="#C45C7A"/>
    <rect x="152" y="80" width="4"  height="4" fill="#C45C7A"/>

    <!-- Center medallion (5px diamond in maroon) -->
    <rect x="96" y="48" width="4"  height="4" fill="#8B2040"/>
    <rect x="92" y="52" width="12" height="4" fill="#8B2040"/>
    <rect x="88" y="56" width="20" height="4" fill="#8B2040"/>
    <rect x="92" y="60" width="12" height="4" fill="#8B2040"/>
    <rect x="96" y="64" width="4"  height="4" fill="#8B2040"/>

    <!-- Center highlight -->
    <rect x="96" y="56" width="4" height="4" fill="#FAD8EC"/>

  </g>
</svg>
